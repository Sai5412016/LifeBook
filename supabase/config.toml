# Diese Funktion MUSS ohne Anmeldung erreichbar sein, weil Großeltern kein
# Konto haben. Der Zugangsschlüssel im Link und der Zugangscode sind der
# Ersatz. Ohne diesen Eintrag würde eine spätere Veröffentlichung über die
# Kommandozeile die Anmeldepflicht wieder einschalten und den Gastzugang
# stillschweigend abschalten — die Seite würde dann für jeden Gast nur noch
# einen Fehler zeigen.
[functions.album]
verify_jwt = false

# media-sign (2026-11-26): stellt signierte R2-Adressen für Original-Fotos aus.
# Nur mit Anmeldung — die Function prüft das Token zusätzlich selbst und
# entscheidet anhand der Haushaltsrolle. Ausdrücklich eingetragen, damit niemand
# es beim Vorbild "album" (ohne Anmeldung) versehentlich abschaltet.
[functions.media-sign]
verify_jwt = true
